name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: valkey/valkey:8
        ports: ["6379:6379"]
        options: >-
          --health-cmd "valkey-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10

    env:
      DATABASE_URL: postgres://nexus:nexus@localhost:5432/nexus
      DATABASE_URL_TEST: postgres://nexus:nexus@localhost:5432/nexus_test
      REDIS_URL: redis://localhost:6379
      NEXT_TELEMETRY_DISABLED: "1"
      TURBO_TELEMETRY_DISABLED: "1"
      APP_URL: http://localhost:3000
      BETTER_AUTH_SECRET: ci-only-secret-not-used-anywhere-else-0123456789
      SEED_ADMIN_EMAIL: admin@me-it.local
      SEED_ADMIN_PASSWORD: Demo-Passwort-2026
      # E2E: the real SDK talks to the mock Claude API in apps/web/e2e/mock-anthropic.mjs.
      ANTHROPIC_API_KEY: e2e-mock-key
      ANTHROPIC_BASE_URL: http://localhost:4010
      # E2E: every e-mail goes to the SMTP sink in apps/web/e2e/smtp-sink.mjs.
      SMTP_HOST: localhost
      SMTP_PORT: "2525"

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare database roles
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -v ON_ERROR_STOP=1 -f docker/postgres/init.sql

      - name: Format
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Prepare database for E2E
        run: pnpm db:migrate && pnpm db:seed

      - name: Install Playwright browser
        run: pnpm --filter @nexus/web exec playwright install --with-deps chromium

      - name: E2E
        run: pnpm --filter @nexus/web e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7
