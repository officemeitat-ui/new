name: Tests und Deployment

on:
  push:
    branches: [main, claude/automated-shift-scheduling-cleaning-1h02ms]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          # Verzeichnis-ID des Microsoft-365-Tenants: nur dessen Konten dürfen die Seite öffnen
          ENTRA_TENANT_ID: ${{ vars.ENTRA_TENANT_ID }}
          # Anwendungs-ID der App-Registrierung (falls nicht in config.production.json)
          ENTRA_CLIENT_ID: ${{ vars.ENTRA_CLIENT_ID }}
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist

  # Veröffentlicht dist/ auf Azure Static Web Apps (app.cleanos.at).
  # Läuft nur auf main und nur, wenn das Secret AZURE_STATIC_WEB_APPS_API_TOKEN gesetzt ist.
  deploy:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    env:
      SWA_TOKEN: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
    steps:
      - uses: actions/download-artifact@v4
        if: env.SWA_TOKEN != ''
        with:
          name: dist
          path: dist
      - uses: Azure/static-web-apps-deploy@v1
        if: env.SWA_TOKEN != ''
        with:
          azure_static_web_apps_api_token: ${{ env.SWA_TOKEN }}
          action: upload
          app_location: dist
          skip_app_build: true
