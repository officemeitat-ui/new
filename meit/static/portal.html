<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kundenportal</title>
  <link rel="icon" href="/brand/icon.png">
  <style>
    @font-face { font-family: "Roboto"; src: url("/brand/fonts/Roboto-Regular.woff2") format("woff2"); font-weight: 400; font-display: swap; }
    @font-face { font-family: "Roboto"; src: url("/brand/fonts/Roboto-Medium.woff2") format("woff2"); font-weight: 500 600; font-display: swap; }
    @font-face { font-family: "Roboto"; src: url("/brand/fonts/Roboto-Bold.woff2") format("woff2"); font-weight: 700; font-display: swap; }
    :root { --bg: #f4f6fa; --card: #fff; --soft: #f8fafc; --text: #0f172a; --muted: #64748b; --border: #e2e8f0; --primary: #00838f; --brand: #00bcd4; --accent: #f79007; --ok: #15803d; --ok-soft: #dcfce7; --warn: #b45309; --warn-soft: #fef3c7; --bad: #b91c1c; --bad-soft: #fee2e2; color-scheme: light; }
    @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #0b1120; --card: #111827; --soft: #0f172a; --text: #e5e7eb; --muted: #94a3b8; --border: #1f2a3c; --primary: #26c6da; --ok: #4ade80; --ok-soft: #14361f; --warn: #fbbf24; --warn-soft: #3b2a0b; --bad: #f87171; --bad-soft: #3d1414; color-scheme: dark; } }
    :root[data-theme="dark"] { --bg: #0b1120; --card: #111827; --soft: #0f172a; --text: #e5e7eb; --muted: #94a3b8; --border: #1f2a3c; --primary: #26c6da; --ok: #4ade80; --ok-soft: #14361f; --warn: #fbbf24; --warn-soft: #3b2a0b; --bad: #f87171; --bad-soft: #3d1414; color-scheme: dark; }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.5 "Roboto", system-ui, -apple-system, "Segoe UI", sans-serif; }
    a { color: var(--primary); }
    header { background: var(--card); border-bottom: 1px solid var(--border); border-top: 3px solid var(--brand); }
    .brandlogo { height: 44px; width: auto; background: #fff; border-radius: 8px; padding: 2px 4px; }
    .wrap { max-width: 980px; margin: 0 auto; padding: 0 16px; }
    .bar { display: flex; align-items: center; gap: 12px; padding: 14px 0; }
    .logo { width: 36px; height: 36px; border-radius: 9px; background: var(--primary); color: #fff; display: grid; place-items: center; font-weight: 800; }
    .spacer { flex: 1; }
    nav { display: flex; gap: 4px; flex-wrap: wrap; padding-bottom: 10px; }
    nav button { border: 0; background: none; color: var(--muted); padding: 7px 12px; border-radius: 8px; font: inherit; cursor: pointer; }
    nav button.active { background: var(--primary); color: #fff; }
    main.wrap { padding: 20px 16px 48px; }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 18px; margin-bottom: 14px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 12px; margin-bottom: 14px; }
    .kpi .l { color: var(--muted); font-size: .78rem; text-transform: uppercase; letter-spacing: .05em; } .kpi .v { font-size: 1.6rem; font-weight: 700; }
    h2 { font-size: 1.1rem; margin: 0 0 .7rem; }
    table { width: 100%; border-collapse: collapse; font-size: .92rem; } th, td { text-align: left; padding: 8px 6px; border-bottom: 1px solid var(--border); vertical-align: top; }
    th { color: var(--muted); font-size: .76rem; text-transform: uppercase; }
    .wrapx { overflow-x: auto; }
    .badge { display: inline-block; padding: 1px 8px; border-radius: 999px; font-size: .76rem; font-weight: 600; background: var(--soft); border: 1px solid var(--border); white-space: nowrap; }
    .ok { background: var(--ok-soft); color: var(--ok); border-color: transparent; } .warn { background: var(--warn-soft); color: var(--warn); border-color: transparent; } .bad { background: var(--bad-soft); color: var(--bad); border-color: transparent; }
    input, textarea { width: 100%; padding: .6rem .7rem; border: 1px solid var(--border); border-radius: 9px; font: inherit; background: var(--card); color: var(--text); }
    textarea { min-height: 110px; resize: vertical; }
    label { display: block; font-weight: 600; font-size: .88rem; margin: .7rem 0 .3rem; }
    .btn { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--border); background: var(--card); color: var(--text); padding: .5rem .9rem; border-radius: 9px; font: inherit; cursor: pointer; text-decoration: none; }
    .btn.primary { background: var(--primary); border-color: var(--primary); color: #fff; }
    .btn[disabled] { opacity: .6; cursor: wait; }
    .muted { color: var(--muted); } .small { font-size: .85rem; }
    .md { line-height: 1.6; overflow-wrap: anywhere; } .md pre { background: var(--soft); padding: .6rem; border-radius: 8px; overflow-x: auto; } .md code { background: var(--soft); padding: 0 .25rem; border-radius: 4px; }
    .msg { padding: .7rem 1rem; border-radius: 12px; margin: .6rem 0; max-width: 90%; } .msg.me { background: var(--primary); color: #fff; margin-left: auto; } .msg.ai { background: var(--soft); border: 1px solid var(--border); }
    .login { min-height: 100vh; display: grid; place-items: center; padding: 16px; }
    .err { color: var(--bad); min-height: 1.3em; margin-top: .5rem; font-size: .9rem; }
    .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    details summary { cursor: pointer; }
    @media (max-width: 600px) { .msg { max-width: 100%; } }
  </style>
</head>
<body>
  <div id="root"></div>
  <script>
    "use strict";
    const root = document.getElementById("root");
    function h(tag, attrs, ...kids) {
      const el = document.createElement(tag);
      for (const [k, v] of Object.entries(attrs || {})) {
        if (v === null || v === undefined || v === false) continue;
        if (k === "class") el.className = v; else if (k.startsWith("on")) el.addEventListener(k.slice(2), v); else if (k === "html") el.innerHTML = v; else el.setAttribute(k, v === true ? "" : v);
      }
      for (const c of kids.flat(Infinity)) if (c !== null && c !== undefined && c !== false) el.append(c instanceof Node ? c : document.createTextNode(String(c)));
      return el;
    }
    async function api(path, opts = {}) {
      const init = { headers: {}, ...opts };
      if (opts.body) { init.body = JSON.stringify(opts.body); init.headers["Content-Type"] = "application/json"; }
      const res = await fetch(path, init);
      const data = (res.headers.get("content-type") || "").includes("json") ? await res.json() : null;
      if (res.status === 401 && !path.endsWith("/login")) { showLogin(); throw new Error("Bitte anmelden."); }
      if (!res.ok) throw new Error(data && typeof data.detail === "string" ? data.detail : "Fehler – bitte Eingaben prüfen.");
      return data;
    }
    const eur = (n) => new Intl.NumberFormat("de-AT", { style: "currency", currency: "EUR" }).format(n || 0);
    const dt = (s) => s ? new Date(s.replace(" ", "T")).toLocaleDateString("de-AT") : "–";
    const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    function md(text) {
      const out = []; let list = null; let code = false;
      for (const raw of esc(text).split("\n")) {
        const line = raw.trimEnd(); let m;
        if (line.startsWith("```")) { if (list) { out.push(`</${list}>`); list = null; } out.push(code ? "</pre>" : "<pre>"); code = !code; continue; }
        if (code) { out.push(raw); continue; }
        const inl = (s) => s.replace(/`([^`]+)`/g, "<code>$1</code>").replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
        if ((m = line.match(/^#{1,4}\s+(.*)$/))) { if (list) { out.push(`</${list}>`); list = null; } out.push(`<h3>${inl(m[1])}</h3>`); }
        else if ((m = line.match(/^\s*[-*]\s+(.*)$/))) { if (list !== "ul") { if (list) out.push(`</${list}>`); out.push("<ul>"); list = "ul"; } out.push(`<li>${inl(m[1])}</li>`); }
        else if ((m = line.match(/^\s*\d+[.)]\s+(.*)$/))) { if (list !== "ol") { if (list) out.push(`</${list}>`); out.push("<ol>"); list = "ol"; } out.push(`<li>${inl(m[1])}</li>`); }
        else if (!line.trim()) { if (list) { out.push(`</${list}>`); list = null; } }
        else { if (list) { out.push(`</${list}>`); list = null; } out.push(`<p>${inl(line)}</p>`); }
      }
      if (list) out.push(`</${list}>`); if (code) out.push("</pre>");
      return h("div", { class: "md", html: out.join("") });
    }
    const table = (cols, rows) => rows.length ? h("div", { class: "wrapx" }, h("table", {}, h("thead", {}, h("tr", {}, cols.map((c) => h("th", {}, c[0])))),
      h("tbody", {}, rows.map((r) => h("tr", {}, cols.map((c) => h("td", {}, c[1](r)))))))) : h("p", { class: "muted" }, "Keine Einträge.");

    function showLogin() {
      const email = h("input", { type: "email", autocomplete: "username" }); const pw = h("input", { type: "password", autocomplete: "current-password" });
      const err = h("div", { class: "err" });
      root.replaceChildren(h("div", { class: "login" }, h("form", { class: "card", style: "width:min(380px,100%)", onsubmit: async (e) => {
        e.preventDefault();
        try { await api("/api/portal/login", { method: "POST", body: { email: email.value, password: pw.value } }); start(); } catch (x) { err.textContent = x.message; }
      } }, h("div", { style: "text-align:center;margin-bottom:.6rem" }, h("img", { src: "/brand/logo", alt: "Logo", style: "max-width:220px;width:100%;height:auto" }), h("div", { class: "muted small" }, "Kundenportal")),
        h("p", { class: "muted small" }, "Ihre Tickets, Geräte, Angebote und Rechnungen – und schnelle Hilfe."),
        h("label", {}, "E-Mail"), email, h("label", {}, "Passwort"), pw,
        h("button", { class: "btn primary", type: "submit", style: "width:100%;justify-content:center;margin-top:1rem" }, "Anmelden"), err)));
      email.focus();
    }

    let me = null; let tab = "start";
    const views = {};
    views.start = async () => h("div", {},
      h("div", { class: "grid" },
        h("div", { class: "card kpi" }, h("div", { class: "l" }, "Offene Tickets"), h("div", { class: "v" }, me.open_tickets)),
        h("div", { class: "card kpi" }, h("div", { class: "l" }, "Geräte"), h("div", { class: "v" }, me.devices), me.devices_eol ? h("span", { class: "badge bad" }, `${me.devices_eol} ohne Herstellersupport`) : h("span", { class: "badge ok" }, "alle im Support")),
        h("div", { class: "card kpi" }, h("div", { class: "l" }, "Security-Score"), h("div", { class: "v" }, me.security ? `${Math.round(me.security.score)}/100` : "–"), me.security ? h("span", { class: `badge ${me.security.level === "gut" ? "ok" : me.security.level === "mittel" ? "warn" : "bad"}` }, me.security.level) : h("span", { class: "muted small" }, "noch kein Check")),
        h("div", { class: "card kpi" }, h("div", { class: "l" }, "Offene Rechnungen"), h("div", { class: "v" }, eur(me.open_invoices)))),
      me.open_quotes ? h("div", { class: "card", style: "border-color:var(--primary)" }, h("strong", {}, `${me.open_quotes} Angebot(e) warten auf Ihre Entscheidung. `), h("a", { href: "#", onclick: (e) => { e.preventDefault(); go("angebote"); } }, "Ansehen →")) : null,
      h("div", { class: "card" }, h("h2", {}, "Problem? So geht's am schnellsten"),
        h("ol", {}, h("li", {}, "Kurz in der ", h("a", { href: "#", onclick: (e) => { e.preventDefault(); go("hilfe"); } }, "Hilfe"), " fragen – viele Dinge sind in 2 Minuten gelöst."),
          h("li", {}, "Sonst ein ", h("a", { href: "#", onclick: (e) => { e.preventDefault(); go("tickets"); } }, "Ticket anlegen"), " – wir melden uns."),
          h("li", {}, "Bei Virus-/Phishing-Verdacht oder Ausfall: Gerät vom Netz trennen und sofort anrufen."))));

    views.tickets = async () => {
      const rows = await api("/api/portal/tickets");
      const title = h("input", { maxlength: 200, placeholder: "z. B. Drucker im Büro druckt nicht" });
      const desc = h("textarea", { maxlength: 5000, placeholder: "Was genau passiert? Seit wann? Wer ist betroffen? Fehlermeldung?" });
      const msg = h("div", { class: "small" });
      const btn = h("button", { class: "btn primary", type: "submit" }, "Ticket senden");
      return h("div", {},
        h("form", { class: "card", onsubmit: async (e) => {
          e.preventDefault(); btn.disabled = true;
          try { const t = await api("/api/portal/tickets", { method: "POST", body: { title: title.value, description: desc.value } });
            msg.textContent = `Danke! Ticket #${t.id} ist eingegangen (Priorität: ${t.priority}).`; title.value = ""; desc.value = ""; setTimeout(() => go("tickets"), 1200); }
          catch (x) { msg.textContent = x.message; } finally { btn.disabled = false; }
        } }, h("h2", {}, "Neues Ticket"), h("label", {}, "Betreff"), title, h("label", {}, "Beschreibung"), desc, h("div", { class: "row", style: "margin-top:.8rem" }, btn, msg)),
        h("div", { class: "card" }, h("h2", {}, "Ihre Tickets"), rows.length ? rows.map((t) => h("details", { style: "border-bottom:1px solid var(--border);padding:.6rem 0" },
          h("summary", {}, h("strong", {}, `#${t.id} ${t.title}`), " ", h("span", { class: `badge ${t.status === "geloest" ? "ok" : "warn"}` }, t.status_label), h("span", { class: "muted small" }, ` · ${dt(t.created_at)}`)),
          h("p", { class: "small", style: "white-space:pre-wrap" }, t.description), t.solution ? h("p", { class: "small" }, h("strong", {}, "Lösung: "), t.solution) : null)) : h("p", { class: "muted" }, "Noch keine Tickets.")));
    };

    views.hilfe = async () => {
      const log = h("div"); const q = h("input", { placeholder: "Ihre Frage, z. B. „Outlook startet nicht“", maxlength: 1000 });
      const btn = h("button", { class: "btn primary", type: "submit" }, "Fragen");
      return h("div", { class: "card" }, h("h2", {}, "Hilfe (KI)"), h("p", { class: "muted small" }, "Antworten basieren auf geprüften Anleitungen Ihres IT-Partners. Wenn es nicht hilft: Ticket anlegen."), log,
        h("form", { class: "row", style: "margin-top:.6rem", onsubmit: async (e) => {
          e.preventDefault(); const text = q.value.trim(); if (!text) return; q.value = ""; btn.disabled = true;
          log.append(h("div", { class: "msg me" }, text)); const wait = h("div", { class: "msg ai muted" }, "Einen Moment …"); log.append(wait);
          try { const r = await api("/api/portal/ask", { method: "POST", body: { question: text } }); wait.replaceWith(h("div", { class: "msg ai" }, md(r.answer),
            r.suggest_ticket ? h("button", { class: "btn", style: "margin-top:.5rem", onclick: () => go("tickets") }, "Hat nicht geholfen → Ticket anlegen") : null)); }
          catch (x) { wait.textContent = x.message; } finally { btn.disabled = false; q.focus(); }
        } }, h("div", { style: "flex:1;min-width:200px" }, q), btn));
    };

    views.geraete = async () => {
      const rows = await api("/api/portal/assets");
      return h("div", { class: "card" }, h("h2", {}, "Ihre Geräte"), table([["Gerät", (r) => r.name], ["Typ", (r) => r.type], ["Betriebssystem", (r) => r.os || "–"],
        ["Herstellersupport", (r) => h("span", { class: `badge ${r.support === "ok" ? "ok" : r.support === "abgelaufen" ? "bad" : "warn"}` }, r.support)], ["Garantie bis", (r) => dt(r.warranty_end)]], rows),
        h("p", { class: "muted small" }, "Geräte ohne Herstellersupport bekommen keine Sicherheitsupdates mehr – sprechen Sie uns auf einen Tausch an."));
    };

    views.angebote = async () => {
      const rows = await api("/api/portal/quotes");
      return h("div", {}, rows.length ? rows.map((q) => {
        const tiers = q.tiers || [];
        const accept = async (tier) => {
          if (!confirm("Angebot verbindlich annehmen?")) return;
          try { await api(`/api/portal/quotes/${q.id}/accept`, { method: "POST", body: { tier } }); alert("Vielen Dank – wir melden uns zur Umsetzung!"); go("angebote"); } catch (x) { alert(x.message); }
        };
        return h("div", { class: "card" }, h("div", { class: "row" }, h("h2", { style: "margin:0" }, q.title), h("span", { class: "spacer" }),
          h("span", { class: `badge ${q.status === "angenommen" ? "ok" : "warn"}` }, q.status === "angenommen" ? "angenommen" : "wartet auf Entscheidung")),
          h("details", { style: "margin-top:.6rem" }, h("summary", {}, "Angebot lesen"), md(q.text),
            h("p", {}, h("a", { href: `/api/portal/quotes/${q.id}/pdf`, target: "_blank", rel: "noopener" }, "Als PDF herunterladen"))),
          q.status === "versendet" ? h("div", { class: "row", style: "margin-top:.8rem" }, tiers.length
            ? tiers.map((t) => h("button", { class: `btn ${t.recommended ? "primary" : ""}`, onclick: () => accept(t.key) }, `${t.label} annehmen (${eur(t.total_once)} + ${eur(t.total_monthly)}/Monat)`))
            : h("button", { class: "btn primary", onclick: () => accept(null) }, `Angebot annehmen (${eur(q.total_once)} + ${eur(q.total_monthly)}/Monat)`)) : null);
      }) : h("div", { class: "card muted" }, "Aktuell keine offenen Angebote."));
    };

    views.rechnungen = async () => {
      const rows = await api("/api/portal/invoices");
      return h("div", { class: "card" }, h("h2", {}, "Rechnungen"), table([["Nr.", (r) => r.number], ["Datum", (r) => dt(r.date)], ["Zeitraum", (r) => r.period], ["Betrag", (r) => eur(r.gross)],
        ["Status", (r) => h("span", { class: `badge ${r.status === "bezahlt" ? "ok" : r.overdue ? "bad" : "warn"}` }, r.status === "bezahlt" ? "bezahlt" : r.overdue ? "überfällig" : `offen bis ${dt(r.due_date)}`)],
        ["", (r) => h("a", { class: "btn", href: `/api/portal/invoices/${r.id}/pdf`, target: "_blank", rel: "noopener" }, "PDF")]], rows));
    };

    const TABS = [["start", "Übersicht"], ["tickets", "Tickets"], ["hilfe", "Hilfe"], ["geraete", "Geräte"], ["angebote", "Angebote"], ["rechnungen", "Rechnungen"]];
    async function go(t) {
      tab = t;
      document.querySelectorAll("nav button").forEach((b) => b.classList.toggle("active", b.dataset.tab === t));
      const main = document.getElementById("main");
      main.replaceChildren(h("p", { class: "muted" }, "Lädt …"));
      try { main.replaceChildren(await views[t]()); } catch (x) { main.replaceChildren(h("div", { class: "card" }, x.message)); }
    }
    async function start() {
      try { me = await api("/api/portal/me"); } catch { return; }
      document.title = `Kundenportal – ${me.company}`;
      root.replaceChildren(
        h("header", {}, h("div", { class: "wrap" }, h("div", { class: "bar" }, h("img", { class: "brandlogo", src: "/brand/logo", alt: me.company }),
          h("div", {}, h("strong", {}, me.customer), h("div", { class: "muted small" }, `Kundenportal ${me.company}`)), h("span", { class: "spacer" }),
          h("span", { class: "muted small" }, me.user.name || me.user.email),
          h("button", { class: "btn", onclick: async () => { await api("/api/portal/logout", { method: "POST" }); showLogin(); } }, "Abmelden")),
          h("nav", {}, TABS.map(([k, l]) => h("button", { "data-tab": k, onclick: () => go(k) }, l))))),
        h("main", { class: "wrap", id: "main" }));
      go(tab);
    }
    start();
  </script>
</body>
</html>
