            [[1, "😞"], [2, "🙁"], [3, "😐"], [4, "🙂"], [5, "😀"]].map(([n, face]) => h("button", {
              class: "btn", title: `${n} von 5`, style: `padding:.2rem .45rem;font-size:1.2rem;${t.rating === n ? "border-color:var(--primary);background:color-mix(in srgb,var(--primary) 12%,transparent)" : ""}`,
              onclick: async () => {
                const comment = n <= 3 ? (prompt("Was können wir besser machen? (optional)") || "") : "";
                try { await api(`/api/portal/tickets/${t.id}/rating`, { method: "POST", body: { rating: n, comment } }); go("tickets"); } catch (x) { alert(x.message); }
              } }, face))) : null); }) : h("p", { class: "muted" }, "Noch keine Tickets.")));
    };

    views.mitarbeiter = async () => {
      const d = await api("/api/portal/staff");
      const out = h("div");
      const sel = (opts, attrs = {}) => h("select", { ...attrs, style: "width:100%;padding:.6rem .7rem;border:1px solid var(--border);border-radius:9px;font:inherit;background:var(--card);color:var(--text)" },
        opts.map(([v, l]) => h("option", { value: v }, l)));
      const formFor = (kind) => {
        const entry = kind === "eintritt";
        const f = { person: h("input", { maxlength: 120, required: true }), email: h("input", { type: "email", maxlength: 200 }), due: h("input", { type: "date" }),
          dept: h("input", { maxlength: 120 }), lic: sel([["", "– weiß nicht / später –"], ...d.licenses.map((l) => [l.id, l.name])]),
          device: sel(entry ? [["neu", "Neues Gerät benötigt"], ["vorhanden", "Vorhandenes Gerät neu einrichten"], ["kein", "Kein Gerät"]] : [["vorhanden", "Gerät wird zurückgegeben"], ["kein", "Kein Gerät"]]),
          phone: h("input", { type: "checkbox", style: "width:auto" }), mailbox: sel([["freigegeben", "Postfach behalten (Kollege/in hat Zugriff)"], ["weiterleiten", "Mails weiterleiten"], ["loeschen", "Postfach löschen"]]),
          handover: h("input", { maxlength: 120, placeholder: "z. B. Franz Huber" }), notes: h("textarea", { maxlength: 3000, style: "min-height:70px" }) };
        const pick = d.m365 && !entry ? sel([["", "– Person aus der Liste wählen –"], ...d.m365.users.filter((u) => u.enabled).map((u) => [u.upn, u.name])], {
          onchange: (e) => { const u = d.m365.users.find((x) => x.upn === e.target.value); if (u) { f.person.value = u.name; f.email.value = u.upn; } } }) : null;
        const msg = h("span", { class: "small" });
        const btn = h("button", { class: "btn primary", type: "submit" }, entry ? "Eintritt melden" : "Austritt melden");
        return h("form", { class: "card", onsubmit: async (e) => {
          e.preventDefault(); btn.disabled = true;
          try {
            const r = await api("/api/portal/staff", { method: "POST", body: { kind, person: f.person.value, email: f.email.value, due_date: f.due.value,
              department: entry ? f.dept.value : "", subscription_id: f.lic.value ? Number(f.lic.value) : null, device: f.device.value, phone: entry && f.phone.checked,
              mailbox: entry ? "" : f.mailbox.value, handover_to: entry ? "" : f.handover.value, notes: f.notes.value } });
            msg.textContent = `Danke! Wir kümmern uns darum (Ticket #${r.ticket_id}, ${r.steps} Schritte).`; setTimeout(() => go("mitarbeiter"), 1500);
          } catch (x) { msg.textContent = x.message; } finally { btn.disabled = false; }
        } }, h("h2", {}, entry ? "Neuer Mitarbeiter" : "Mitarbeiter verlässt uns"),
          pick ? [h("label", {}, "Person"), pick] : null,
          h("label", {}, "Name"), f.person, h("label", {}, entry ? "Gewünschte E-Mail-Adresse (optional)" : "E-Mail-Adresse"), f.email,
          h("label", {}, entry ? "Erster Arbeitstag" : "Letzter Arbeitstag"), f.due,
          entry ? [h("label", {}, "Abteilung"), f.dept] : null,
          d.licenses.length ? [h("label", {}, "Microsoft-365-Lizenz"), f.lic] : null,
          h("label", {}, "Gerät"), f.device,
          entry ? h("label", { class: "row", style: "font-weight:400" }, f.phone, "Telefon/Teams-Telefonie benötigt") : [h("label", {}, "Postfach"), f.mailbox, h("label", {}, "Daten und Postfach übernimmt"), f.handover],
          h("label", {}, "Sonstiges (Programme, Ordner, Zugänge …)"), f.notes,
          h("div", { class: "row", style: "margin-top:.8rem" }, btn, msg));
      };
      const tabs = h("div", { class: "row", style: "margin-bottom:.6rem" },
        h("button", { class: "btn", onclick: () => out.replaceChildren(formFor("eintritt")) }, "+ Neuer Mitarbeiter"),
        h("button", { class: "btn", onclick: () => out.replaceChildren(formFor("austritt")) }, "– Mitarbeiter verlässt uns"));
      const label = { offen: "offen", in_arbeit: "in Arbeit", erledigt: "erledigt", storniert: "storniert" };
      const m = d.m365;
      const withMfa = m ? m.users.filter((u) => u.enabled && u.mfa === 1).length : 0;
      const enabled = m ? m.users.filter((u) => u.enabled).length : 0;
      return h("div", {}, h("div", { class: "card" }, h("h2", {}, "Ein- und Austritte"),
          h("p", { class: "small muted" }, "Melden Sie neue oder ausscheidende Mitarbeiter rechtzeitig – wir kümmern uns um Konto, Lizenz, Gerät, Zugänge und Datenübergabe."),
          tabs, out,
          d.changes.length ? d.changes.map((c) => h("details", { style: "border-bottom:1px solid var(--border);padding:.5rem 0" },
            h("summary", {}, h("strong", {}, `${c.kind_label}: ${c.person}`), " ", h("span", { class: `badge ${c.status === "erledigt" ? "ok" : "warn"}` }, label[c.status] || c.status),
              h("span", { class: "muted small" }, ` · ${c.due_date ? dt(c.due_date) : "ohne Datum"} · ${c.done}/${c.total} erledigt`)),
            h("ul", { class: "small" }, c.steps.map((s) => h("li", { style: s.done ? "color:var(--muted)" : "" }, `${s.done ? "✓" : "○"} ${s.text}`))))) : h("p", { class: "muted small" }, "Noch keine Meldungen.")),
        m ? h("div", { class: "card" }, h("h2", {}, "Ihre Microsoft-365-Konten"),
          h("p", { class: "small" }, h("span", { class: `badge ${withMfa === enabled ? "ok" : "warn"}` }, `${withMfa} von ${enabled} mit Zwei-Faktor-Anmeldung`),
            withMfa < enabled ? h("span", { class: "muted" }, " – Konten ohne zweiten Faktor sind das Haupteinfallstor für Angreifer. Wir helfen gerne beim Einrichten.") : null),
          table([["Name", (u) => h("div", {}, h("strong", {}, u.name), h("div", { class: "muted small" }, u.upn))],
            ["Lizenz", (u) => u.licenses.join(", ") || "–"],
            ["Zwei-Faktor", (u) => u.mfa === null ? "–" : h("span", { class: `badge ${u.mfa ? "ok" : "bad"}` }, u.mfa ? "aktiv" : "fehlt")],
            ["Letzte Anmeldung", (u) => u.last_sign_in ? dt(u.last_sign_in) : "–"],
            ["Status", (u) => u.enabled ? "aktiv" : h("span", { class: "badge" }, "gesperrt")]], m.users),
          h("p", { class: "muted small" }, `Stand: ${dt(m.last_sync)}`)) : null);
    };

    views.pruefen = async () => {
      const out = h("div");
      const VC = { "gefährlich": "bad", "verdächtig": "warn", "unauffällig": "ok" };
      return h("div", { class: "card" }, h("h2", {}, "Verdächtige E-Mail prüfen lassen"),
        h("p", { class: "small muted" }, "Sie sind unsicher, ob eine E-Mail echt ist? Laden Sie sie hier hoch – Sie bekommen sofort eine Einschätzung und wir sehen sie uns zusätzlich an. Bitte vorher keine Links anklicken und keine Anhänge öffnen."),
        h("ol", { class: "small" }, h("li", {}, "Outlook (Windows): Mail mit der Maus auf den Desktop ziehen – es entsteht eine .msg-Datei."),
          h("li", {}, "Outlook im Web / neues Outlook: Mail öffnen → „…“ → „Herunterladen“ (.eml)."),
          h("li", {}, "Datei hier hineinziehen oder anklicken und auswählen.")),
        dropZone("E-Mail-Datei hier ablegen (.eml / .msg)", "Max. 20 MB · wird vertraulich behandelt", async ([f]) => {
          out.replaceChildren(h("p", { class: "muted" }, "Wird geprüft …"));
          try {
            const r = await upload("/api/portal/phishing", f);
            out.replaceChildren(h("div", { class: `verdict ${VC[r.verdict] || "warn"}` }, h("strong", {}, `${r.verdict === "unauffällig" ? "✓ Keine typischen Phishing-Merkmale" : `⚠ ${r.verdict === "gefährlich" ? "Sehr wahrscheinlich Phishing" : "Verdächtig"}`}`), ` · Risiko ${r.score}/100`),
              r.reasons.length ? h("ul", {}, r.reasons.map((x) => h("li", {}, x))) : null,
              h("p", {}, h("strong", {}, "Was Sie jetzt tun sollten: "), r.advice),
              h("p", { class: "small muted" }, `Wir haben dazu Ticket #${r.ticket_id} angelegt und melden uns. Wenn Sie bereits auf einen Link geklickt oder Daten eingegeben haben: bitte sofort anrufen.`));
          } catch (x) { out.replaceChildren(h("p", { class: "err" }, x.message)); }
        }, ".eml,.msg,message/rfc822", false), out);
    };

    views.hilfe = async () => {
      const log = h("div"); const q = h("input", { placeholder: "Ihre Frage, z. B. „Outlook startet nicht“", maxlength: 1000 });
      const btn = h("button", { class: "btn primary", type: "submit" }, "Fragen");
      return h("div", { class: "card" }, h("h2", {}, "Hilfe (KI)"), h("p", { class: "muted small" }, "Antworten basieren auf geprüften Anleitungen Ihres IT-Partners. Wenn es nicht hilft: Ticket anlegen."), log,
        h("form", { class: "row", style: "margin-top:.6rem", onsubmit: async (e) => {
          e.preventDefault(); const text = q.value.trim(); if (!text) return; q.value = ""; btn.disabled = true;
          log.append(h("div", { class: "msg me" }, text)); const wait = h("div", { class: "msg ai muted" }, "Einen Moment …"); log.append(wait);
          try { const r = await api("/api/portal/ask", { method: "POST", body: { question: text } }); wait.replaceWith(h("div", { class: "msg ai" }, md(r.answer),
            r.suggest_ticket ? h("button", { class: "btn", style: "margin-top:.5rem", onclick: () => go("tickets") }, "Hat nicht geholfen → Ticket anlegen") : null)); }
          catch (x) { wait.textContent = x.message; } finally { btn.disabled = false; q.focus(); }
        } }, h("div", { style: "flex:1;min-width:200px" }, q), btn));
    };

    views.wartung = async () => {
      const [m, bk] = await Promise.all([api("/api/portal/maintenance"), api("/api/portal/backups").catch(() => [])]);
      const res = (r, label) => h("span", { class: `badge ${r === "ok" ? "ok" : r === "problem" ? "bad" : r ? "warn" : ""}` }, label || "–");
      const color = { ok: "var(--ok)", warnung: "var(--warn)", fehler: "var(--bad)", "überfällig": "var(--bad)", fehlt: "var(--bad-soft)" };
      const lamp = (grid) => h("span", { style: "display:inline-flex;gap:2px" }, grid.map((g) => h("i", { style: `width:10px;height:16px;border-radius:3px;display:inline-block;background:${color[g] || "var(--soft)"};border:1px solid var(--border)` })));
      const bkLabel = { ok: ["ok", "erfolgreich"], warnung: ["warn", "mit Warnung"], fehler: ["bad", "fehlgeschlagen – wir kümmern uns"], "überfällig": ["bad", "Bericht fehlt – wir prüfen"] };
      return h("div", {},
        bk.length ? h("div", { class: "card" }, h("h2", {}, "Ihre Datensicherung"),
          table([["Sicherung", (b) => b.name], ["Letzte 14 Tage", (b) => lamp(b.grid)],
            ["Status", (b) => { const [c, l] = bkLabel[b.status] || ["", "–"]; return h("span", { class: `badge ${c}` }, l); }],
            ["Zuletzt erfolgreich", (b) => b.last_success ? dt(b.last_success) : "–"]], bk),
          h("p", { class: "muted small" }, "Wir werten jeden Sicherungsbericht automatisch aus – bei Fehlern oder ausbleibenden Berichten werden wir sofort tätig.")) : null,
        h("div", { class: "card" }, h("h2", {}, "Was wir für Sie vorbeugend prüfen"),
          m.plan.length ? table([["Prüfung", (r) => r.title], ["Rhythmus", (r) => r.interval_label], ["Zuletzt", (r) => dt(r.last_done_at)],
            ["Ergebnis", (r) => res(r.last_result, r.last_result_label)], ["Nächste", (r) => dt(r.next_due)]], m.plan)
            : h("p", { class: "muted" }, "Für Ihr Unternehmen ist noch kein Wartungsplan hinterlegt.")),
        h("div", { class: "card" }, h("h2", {}, "Nachweise (letzte 12 Monate)"),
          table([["Datum", (r) => dt(r.done_at)], ["Prüfung", (r) => r.title], ["Checkliste", (r) => `${r.checked}/${r.items} Punkte`],
            ["Fernwartung", (r) => r.remote_minutes ? `${r.remote_minutes} Min. (protokolliert)` : "–"], ["Ergebnis", (r) => res(r.result, r.result_label)]], m.done),
          h("p", { class: "muted small" }, "Regelmäßige Prüfungen sind auch ein Nachweis für Versicherung und NIS2 (Wirksamkeit der Sicherheitsmaßnahmen).")));
    };

    views.geraete = async () => {
      const rows = await api("/api/portal/assets");
      return h("div", { class: "card" }, h("h2", {}, "Ihre Geräte"), table([["Gerät", (r) => r.name], ["Typ", (r) => r.type], ["Betriebssystem", (r) => r.os || "–"],
        ["Herstellersupport", (r) => h("span", { class: `badge ${r.support === "ok" ? "ok" : r.support === "abgelaufen" ? "bad" : "warn"}` }, r.support)],
        ...(rows.some((r) => r.health) ? [["Schutz", (r) => r.health ? h("span", {}, [["encrypted", "verschlüsselt", "unverschlüsselt"], ["antivirus", "Virenschutz", "Virenschutz prüfen"], ["updates", "aktuell", "Updates fehlen"]]
          .filter(([k]) => r.health[k] !== null).map(([k, good, bad]) => h("span", { class: `badge ${r.health[k] ? "ok" : "bad"}`, style: "margin-right:.2rem" }, r.health[k] ? good : bad))) : h("span", { class: "muted" }, "–")]] : []),
        ["Garantie bis", (r) => dt(r.warranty_end)]], rows),
        h("p", { class: "muted small" }, "Geräte ohne Herstellersupport bekommen keine Sicherheitsupdates mehr – sprechen Sie uns auf einen Tausch an."));
    };

    views.angebote = async () => {
      const rows = await api("/api/portal/quotes");
      return h("div", {}, rows.length ? rows.map((q) => {
        const tiers = q.tiers || [];
        const accept = async (tier) => {
          if (!confirm("Angebot verbindlich annehmen?")) return;
          try { await api(`/api/portal/quotes/${q.id}/accept`, { method: "POST", body: { tier } }); alert("Vielen Dank – wir melden uns zur Umsetzung!"); go("angebote"); } catch (x) { alert(x.message); }
        };
        return h("div", { class: "card" }, h("div", { class: "row" }, h("h2", { style: "margin:0" }, q.title), h("span", { class: "spacer" }),
          h("span", { class: `badge ${q.status === "angenommen" ? "ok" : "warn"}` }, q.status === "angenommen" ? "angenommen" : "wartet auf Entscheidung")),
          h("details", { style: "margin-top:.6rem" }, h("summary", {}, "Angebot lesen"), md(q.text),
            h("p", {}, h("a", { href: `/api/portal/quotes/${q.id}/pdf`, target: "_blank", rel: "noopener" }, "Als PDF herunterladen"))),
          q.status === "versendet" ? h("div", { class: "row", style: "margin-top:.8rem" }, tiers.length
            ? tiers.map((t) => h("button", { class: `btn ${t.recommended ? "primary" : ""}`, onclick: () => accept(t.key) }, `${t.label} annehmen (${eur(t.total_once)} + ${eur(t.total_monthly)}/Monat)`))
            : h("button", { class: "btn primary", onclick: () => accept(null) }, `Angebot annehmen (${eur(q.total_once)} + ${eur(q.total_monthly)}/Monat)`)) : null);
      }) : h("div", { class: "card muted" }, "Aktuell keine offenen Angebote."));
    };

    views.rechnungen = async () => {
      const [rows, files] = await Promise.all([api("/api/portal/invoices"), api("/api/portal/files").catch(() => [])]);
      return h("div", {}, h("div", { class: "card" }, h("h2", {}, "Rechnungen"), table([["Nr.", (r) => r.number], ["Datum", (r) => dt(r.date)], ["Zeitraum", (r) => r.period], ["Betrag", (r) => eur(r.gross)],
        ["Status", (r) => h("span", { class: `badge ${r.status === "bezahlt" ? "ok" : r.overdue ? "bad" : "warn"}` }, r.status === "bezahlt" ? "bezahlt" : r.overdue ? "überfällig" : `offen bis ${dt(r.due_date)}`)],
        ["", (r) => h("a", { class: "btn", href: `/api/portal/invoices/${r.id}/pdf`, target: "_blank", rel: "noopener" }, "PDF")]], rows)),
        files.length ? h("div", { class: "card" }, h("h2", {}, "Dokumente"), h("p", { class: "muted", style: "margin-top:0" }, "Von uns für Sie bereitgestellt – Verträge, Protokolle und Berichte."),
          table([["Datei", (f) => f.name], ["Größe", (f) => kb(f.size)], ["Stand", (f) => dt(f.at)],
            ["", (f) => h("a", { class: "btn", href: `/api/portal/attachments/${f.id}`, target: "_blank", rel: "noopener" }, "Herunterladen")]], files)) : null);
    };

    const TABS = [["start", "Übersicht"], ["tickets", "Tickets"], ["hilfe", "Hilfe"], ["pruefen", "E-Mail prüfen"], ["mitarbeiter", "Mitarbeiter"], ["geraete", "Geräte"], ["wartung", "Wartung"], ["angebote", "Angebote"], ["rechnungen", "Rechnungen & Dokumente"]];
    async function go(t) {
      tab = t;
      document.querySelectorAll("nav button").forEach((b) => b.classList.toggle("active", b.dataset.tab === t));
      const main = document.getElementById("main");
      main.replaceChildren(h("p", { class: "muted" }, "Lädt …"));
      try { main.replaceChildren(await views[t]()); } catch (x) { main.replaceChildren(h("div", { class: "card" }, x.message)); }
    }
    async function start() {
      try { me = await api("/api/portal/me"); } catch { return; }
      document.title = `Kundenportal – ${me.company}`;
      root.replaceChildren(
        h("header", {}, h("div", { class: "wrap" }, h("div", { class: "bar" }, h("img", { class: "brandlogo", src: "/brand/logo", alt: me.company }),
          h("div", {}, h("strong", {}, me.customer), h("div", { class: "muted small" }, `Kundenportal ${me.company}`)), h("span", { class: "spacer" }),
          h("span", { class: "muted small" }, me.user.name || me.user.email),
          h("button", { class: "btn", onclick: async () => { await api("/api/portal/logout", { method: "POST" }); showLogin(); } }, "Abmelden")),
          h("nav", {}, TABS.map(([k, l]) => h("button", { "data-tab": k, onclick: () => go(k) }, l))))),
        h("main", { class: "wrap", id: "main" }));
      go(tab);
    }
    start();
  </script>
</body>
</html>
