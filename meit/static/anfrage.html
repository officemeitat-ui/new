<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Anfrage senden</title>
  <link rel="icon" href="/brand/icon.png">
  <style>
    @font-face { font-family: "Roboto"; src: url("/brand/fonts/Roboto-Regular.woff2") format("woff2"); font-weight: 400; font-display: swap; }
    @font-face { font-family: "Roboto"; src: url("/brand/fonts/Roboto-Medium.woff2") format("woff2"); font-weight: 500 600; font-display: swap; }
    @font-face { font-family: "Roboto"; src: url("/brand/fonts/Roboto-Bold.woff2") format("woff2"); font-weight: 700; font-display: swap; }
    :root { --bg: #f4f6fa; --card: #fff; --text: #0f172a; --muted: #64748b; --border: #e2e8f0; --primary: #00838f; --brand: #00bcd4; --accent: #f79007; --ok: #15803d; --bad: #b91c1c; color-scheme: light; }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) { --bg: #0b1120; --card: #111827; --text: #e5e7eb; --muted: #94a3b8; --border: #1f2a3c; --primary: #26c6da; --ok: #4ade80; --bad: #f87171; color-scheme: dark; }
    }
    :root[data-theme="dark"] { --bg: #0b1120; --card: #111827; --text: #e5e7eb; --muted: #94a3b8; --border: #1f2a3c; --primary: #26c6da; --ok: #4ade80; --bad: #f87171; color-scheme: dark; }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.5 "Roboto", system-ui, -apple-system, "Segoe UI", sans-serif; }
    a { color: var(--primary); }
    main { max-width: 560px; margin: 0 auto; padding: 32px 16px 48px; }
    .card { background: var(--card); border: 1px solid var(--border); border-top: 4px solid var(--brand); border-radius: 14px; padding: 24px; }
    .brandlogo { display: block; max-width: 200px; width: 60%; height: auto; margin: 0 auto 1rem; }
    h1 { font-size: 1.4rem; margin: 0 0 .3rem; }
    p.lead { color: var(--muted); margin: 0 0 1.2rem; }
    label { display: block; font-weight: 600; font-size: .9rem; margin: .9rem 0 .3rem; }
    input, textarea { width: 100%; padding: .65rem .75rem; border: 1px solid var(--border); border-radius: 9px; font: inherit; background: var(--card); color: var(--text); }
    textarea { min-height: 130px; resize: vertical; }
    input:focus, textarea:focus { outline: 2px solid color-mix(in srgb, var(--primary) 30%, transparent); border-color: var(--primary); }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 0 12px; }
    .hp { position: absolute; left: -10000px; width: 1px; height: 1px; overflow: hidden; }
    .consent { display: flex; gap: .6rem; align-items: flex-start; font-weight: 400; font-size: .85rem; color: var(--muted); }
    .consent input { width: auto; margin-top: .25rem; }
    button { margin-top: 1.2rem; width: 100%; padding: .8rem; border: 0; border-radius: 10px; background: var(--primary); color: #fff; font: inherit; font-weight: 600; cursor: pointer; }
    button[disabled] { opacity: .6; cursor: wait; }
    .msg { margin-top: 1rem; font-size: .95rem; }
    .msg.ok { color: var(--ok); } .msg.bad { color: var(--bad); }
    .foot { text-align: center; color: var(--muted); font-size: .8rem; margin-top: 1rem; }
    @media (max-width: 480px) { .row { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <main>
    <div class="card">
      <img class="brandlogo" src="/brand/logo" alt="Logo">
      <h1 id="title">Wie können wir helfen?</h1>
      <p class="lead">Schreiben Sie uns kurz Ihr Anliegen – wir melden uns innerhalb eines Werktags.</p>
      <form id="form" novalidate>
        <div class="row">
          <div><label for="name">Name *</label><input id="name" name="name" required maxlength="120" autocomplete="name"></div>
          <div><label for="company">Firma</label><input id="company" name="company" maxlength="160" autocomplete="organization"></div>
        </div>
        <div class="row">
          <div><label for="email">E-Mail *</label><input id="email" name="email" type="email" required maxlength="200" autocomplete="email"></div>
          <div><label for="phone">Telefon</label><input id="phone" name="phone" maxlength="60" autocomplete="tel"></div>
        </div>
        <label for="message">Ihr Anliegen *</label>
        <textarea id="message" name="message" required maxlength="5000" placeholder="z. B. Wir sind 15 Personen und suchen laufende IT-Betreuung inkl. Backup …"></textarea>
        <div class="hp" aria-hidden="true"><label for="website">Website</label><input id="website" name="website" tabindex="-1" autocomplete="off"></div>
        <label class="consent"><input type="checkbox" id="consent" required> <span>Ich bin einverstanden, dass meine Angaben zur Bearbeitung meiner Anfrage gespeichert und verarbeitet werden. Die Daten werden nicht an Dritte weitergegeben.</span></label>
        <button type="submit" id="submit">Anfrage senden</button>
        <div class="msg" id="msg" role="status" aria-live="polite"></div>
      </form>
    </div>
    <div class="foot" id="foot"></div>
  </main>
  <script>
    "use strict";
    const $ = (id) => document.getElementById(id);
    fetch("api/public/info").then((r) => r.ok ? r.json() : null).then((info) => {
      if (!info) return;
      document.title = `Anfrage an ${info.company}`;
      $("title").textContent = `Anfrage an ${info.company}`;
      if (info.booking_url && /^https:\/\//.test(info.booking_url)) {
        const a = document.createElement("a");
        a.href = info.booking_url; a.textContent = "Lieber direkt einen Termin buchen →"; a.rel = "noopener"; a.target = "_blank";
        $("foot").append(a);
      }
    }).catch(() => {});
    $("form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const msg = $("msg");
      msg.className = "msg";
      const data = Object.fromEntries(["name", "company", "email", "phone", "message", "website"].map((k) => [k, $(k).value.trim()]));
      if (!data.name || !data.email.includes("@") || data.message.length < 5) { msg.className = "msg bad"; msg.textContent = "Bitte Name, gültige E-Mail und Ihr Anliegen angeben."; return; }
      if (!$("consent").checked) { msg.className = "msg bad"; msg.textContent = "Bitte der Verarbeitung Ihrer Angaben zustimmen."; return; }
      $("submit").disabled = true;
      try {
        const res = await fetch("api/public/inquiry", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(data) });
        if (res.status === 429) throw new Error("Zu viele Anfragen – bitte versuchen Sie es später erneut.");
        if (!res.ok) { const d = await res.json().catch(() => ({})); throw new Error(typeof d.detail === "string" ? d.detail : "Bitte Eingaben prüfen."); }
        $("form").reset();
        msg.className = "msg ok";
        msg.textContent = "Danke! Ihre Anfrage ist bei uns eingegangen. Sie erhalten in Kürze eine Rückmeldung.";
      } catch (err) {
        msg.className = "msg bad"; msg.textContent = err.message || "Senden fehlgeschlagen.";
      } finally { $("submit").disabled = false; }
    });
  </script>
</body>
</html>
