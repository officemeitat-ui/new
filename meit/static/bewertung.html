<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Ihre Bewertung</title>
  <link rel="icon" href="/brand/icon.png">
  <style>
    @font-face { font-family: "Roboto"; src: url("/brand/fonts/Roboto-Regular.woff2") format("woff2"); font-weight: 400; font-display: swap; }
    @font-face { font-family: "Roboto"; src: url("/brand/fonts/Roboto-Bold.woff2") format("woff2"); font-weight: 700; font-display: swap; }
    :root { --bg: #f3f7f8; --card: #fff; --text: #17252a; --muted: #5a5656; --border: #d6e4e7; --primary: #00838f; --brand: #00bcd4; --accent: #f79007; color-scheme: light; }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) { --bg: #0b1120; --card: #111827; --text: #e5e7eb; --muted: #94a3b8; --border: #1f2a3c; --primary: #26c6da; color-scheme: dark; }
    }
    :root[data-theme="dark"] { --bg: #0b1120; --card: #111827; --text: #e5e7eb; --muted: #94a3b8; --border: #1f2a3c; --primary: #26c6da; color-scheme: dark; }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.5 "Roboto", system-ui, -apple-system, "Segoe UI", sans-serif; }
    main { max-width: 560px; margin: 0 auto; padding: 32px 16px 48px; }
    .card { background: var(--card); border: 1px solid var(--border); border-top: 4px solid var(--brand); border-radius: 14px; padding: 24px; }
    .logo { display: block; max-width: 180px; width: 55%; height: auto; margin: 0 auto 1rem; }
    h1 { font-size: 1.3rem; margin: 0 0 .3rem; text-align: center; }
    p.lead { color: var(--muted); text-align: center; margin: 0 0 1.2rem; }
    .faces { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
    .faces button { border: 2px solid var(--border); background: var(--card); color: var(--text); border-radius: 12px; padding: 10px 4px; cursor: pointer; font: inherit; font-size: .78rem; }
    .faces button span { display: block; font-size: 2rem; line-height: 1.2; }
    .faces button.on { border-color: var(--primary); background: color-mix(in srgb, var(--primary) 10%, transparent); font-weight: 700; }
    textarea { width: 100%; min-height: 110px; margin-top: 1rem; padding: .7rem; border: 1px solid var(--border); border-radius: 9px; font: inherit; background: var(--card); color: var(--text); }
    .send { margin-top: .8rem; width: 100%; padding: .75rem; border: 0; border-radius: 10px; background: var(--primary); color: #fff; font: inherit; font-weight: 700; cursor: pointer; }
    .msg { text-align: center; margin-top: 1rem; min-height: 1.5em; }
    .accent { display: block; width: 44px; height: 3px; background: var(--accent); margin: .5rem auto 1rem; }
  </style>
</head>
<body>
  <main>
    <div class="card">
      <img class="logo" src="/brand/logo" alt="Logo">
      <h1 id="title">Wie zufrieden waren Sie?</h1>
      <span class="accent"></span>
      <p class="lead" id="lead">Ihre Rückmeldung hilft uns, noch besser zu werden.</p>
      <div class="faces" id="faces"></div>
      <textarea id="comment" maxlength="2000" placeholder="Möchten Sie uns noch etwas mitteilen? (optional)"></textarea>
      <button class="send" id="send">Absenden</button>
      <div class="msg" id="msg" role="status" aria-live="polite"></div>
    </div>
  </main>
  <script>
    "use strict";
    const $ = (id) => document.getElementById(id);
    const q = new URLSearchParams(location.search);
    const token = q.get("t") || "";
    const FACES = [[5, "😀", "sehr zufrieden"], [4, "🙂", "zufrieden"], [3, "😐", "geht so"], [2, "🙁", "unzufrieden"], [1, "😞", "sehr unzufrieden"]];
    let rating = Number(q.get("r")) || 0;
    const draw = () => {
      $("faces").replaceChildren(...FACES.map(([n, face, label]) => {
        const b = document.createElement("button");
        b.type = "button"; b.className = n === rating ? "on" : ""; b.setAttribute("aria-pressed", String(n === rating));
        const s = document.createElement("span"); s.textContent = face; b.append(s, label);
        b.onclick = () => { rating = n; draw(); save(false); };
        return b;
      }));
    };
    async function save(withComment) {
      if (!rating) { $("msg").textContent = "Bitte einen Smiley wählen."; return; }
      const res = await fetch(`api/public/csat/${encodeURIComponent(token)}`, { method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ rating, comment: withComment ? $("comment").value.trim() : "" }) });
      if (!res.ok) { const d = await res.json().catch(() => ({})); $("msg").textContent = d.detail || "Speichern nicht möglich."; return; }
      $("msg").textContent = withComment ? "Danke für Ihre Rückmeldung!" : (rating >= 4 ? "Danke! Schön, dass wir helfen konnten." : "Danke für Ihre ehrliche Rückmeldung – wir melden uns.");
    }
    $("send").onclick = () => save(true);
    fetch(`api/public/csat/${encodeURIComponent(token)}`).then((r) => r.ok ? r.json() : Promise.reject(r)).then((d) => {
      document.title = `Bewertung · ${d.company}`;
      $("lead").textContent = `Ihr Anliegen „${d.title}“ (Ticket #${d.ticket}) ist erledigt.`;
      if (!rating && d.rating) rating = d.rating;
      if (d.comment) $("comment").value = d.comment;
      draw();
      if (Number(q.get("r"))) save(false);
    }).catch(() => { $("faces").replaceChildren(); $("lead").textContent = "Diese Umfrage wurde nicht gefunden oder ist abgelaufen."; $("comment").hidden = true; $("send").hidden = true; });
  </script>
</body>
</html>
